name: Atualizar Dados Clinica

on:
  schedule:
    - cron: '0 8 * * *' # Executa todos os dias às 08:00 UTC
  workflow_dispatch:    # Permite executar manualmente a partir do botão no GitHub

jobs:
  executar-robo:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar dependências do Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Instalar navegador do Playwright
      run: playwright install chromium

    - name: Executar o robô de extração
      env:
        CLINICA_EMAIL: ${{ secrets.CLINICA_EMAIL }}
        CLINICA_SENHA: ${{ secrets.CLINICA_SENHA }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: python robo.py